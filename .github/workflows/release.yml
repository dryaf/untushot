name: Build and publish release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.9.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.75.0
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Validate the release tag
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'^version = "([^"]+)"', Path('Cargo.toml').read_text(), re.M)[1]
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Stable versions only'
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match Cargo.toml'
          assert Path('docs/releases/' + os.environ['RELEASE_TAG'] + '.md').is_file()
          PY
      - name: Install Rust and check formatting
        run: |
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt
          cargo fmt --all -- --check
      - name: Build and test Debian and AppImage packages
        run: python3 tools/package.py --engine docker
      - name: Check provenance and stage release notes
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          info = json.loads(Path('dist/build-info.json').read_text())
          assert not info['dirty'], 'Release source tree must be clean'
          assert info['commit'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          PY
          cp "docs/releases/$RELEASE_TAG.md" dist/release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: dist/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: dist
      - name: Publish verified assets
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists. Refusing to overwrite its assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "UntuShot $RELEASE_TAG" --notes-file release-notes.md \
            ./*.deb ./*.AppImage SHA256SUMS build-info.json
          gh release edit "$RELEASE_TAG" --draft=false --latest
